name: Build macOS desktop app
on:
  push:
    branches: [main]
    paths: ['desktop.py', 'app.py', 'requirements-desktop.txt', '.github/workflows/macos-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller==6.19.0
      - name: Test desktop and library
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build application bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name M3uApp
          --osx-bundle-identifier com.m3uapp.desktop desktop.py
      - name: Check packaged app startup
        run: |
          dist/M3uApp.app/Contents/MacOS/M3uApp --smoke-test
      - name: Archive app preserving bundle permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/M3uApp.app M3uApp-macOS-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: M3uApp-macOS-${{ matrix.architecture }}
          path: M3uApp-macOS-${{ matrix.architecture }}.zip
